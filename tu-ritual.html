<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tu ritual · GAROA Organic Skin Rituals</title>

<link rel="icon" type="image/png" href="narciso.garoa.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --garnet: #540B0E;
    --cream:  #F9F7F6;
    --pink:   #E9D9D6;
    --dark:   #2A1A1B;
    --text:   #3D2B2C;
    --muted:  #8A7070;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 24px 40px;
  }
  header { text-align: center; margin-bottom: 32px; }
  header img { height: 96px; width: auto; filter: brightness(0) invert(1); opacity: 0.92; }

  .hero { text-align: center; max-width: 480px; margin-bottom: 32px; }
  .page-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.35em;
    text-transform: uppercase; color: var(--pink);
    margin-bottom: 16px; display: block;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    font-weight: 300; line-height: 1.25; color: var(--cream);
    margin-bottom: 14px;
  }
  h1 em { font-style: italic; color: var(--pink); }
  .hero-sub { font-size: 0.92rem; line-height: 1.8; color: rgba(249,247,246,0.65); }

  .video-wrap {
    width: 100%; max-width: 420px; aspect-ratio: 9 / 16;
    background: #000; overflow: hidden;
  }
  .video-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }

  .aviso {
    max-width: 420px; text-align: center; margin-top: 24px;
    font-size: 0.78rem; line-height: 1.8; color: rgba(249,247,246,0.5);
  }
  .aviso a { color: rgba(249,247,246,0.75); }

  footer {
    margin-top: auto; padding-top: 48px;
    text-align: center; font-size: 0.72rem; letter-spacing: 0.15em; color: rgba(249,247,246,0.35);
  }
  footer a { color: rgba(249,247,246,0.35); text-decoration: none; }
</style>
</head>
<body>

<header>
  <img src="narciso.garoa.png" alt="GAROA Organic Skin Rituals">
</header>

<div class="hero">
  <span class="page-label">Tu vídeo</span>
  <h1>Ya está aquí. <em>Tu ritual.</em></h1>
  <p class="hero-sub">Ponte cómoda, baja el volumen que necesites y empieza cuando quieras.</p>
</div>

<div class="video-wrap">
  <video id="video-ritual" controls playsinline preload="metadata"></video>
</div>

<p class="aviso">Este acceso es solo para ti. <a href="derechos-de-autor.html">Derechos de autor</a>.</p>

<footer>
  <a href="/">GAROA · Organic Skin Rituals</a>
</footer>

<script>
  const VIDEO_URL = ''; // pega aquí el enlace directo al archivo de vídeo cuando lo tengas subido
  document.getElementById('video-ritual').src = VIDEO_URL;
</script>
</body>
</html>
